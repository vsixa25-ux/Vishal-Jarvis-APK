name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or !(Test-Path -LiteralPath $sdkRoot)) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or !(Test-Path -LiteralPath $sdkRoot)) {
            $sdkRoot = "C:\Android\android-sdk"
          }

          if (!(Test-Path -LiteralPath $sdkRoot)) {
            throw "Android SDK installation not found at: $sdkRoot"
          }

          $sdkmanager = Get-ChildItem -Path "$sdkRoot\cmdline-tools" -Filter "sdkmanager.bat" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$sdkmanager) {
            throw "Android SDK Manager (sdkmanager.bat) not found."
          }

          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdkmanager.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$sdkRoot\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Prevent stderr warnings from batch files from failing the PowerShell step
          $ErrorActionPreference = "Continue"

          # Accept SDK licenses without interactive prompts
          1..100 | ForEach-Object { "y" } | & $sdkmanager.FullName "--sdk_root=$sdkRoot" "--licenses" | Out-Null

          # Embed quotes around package names so cmd.exe does not split arguments on semicolons (;)
          & $sdkmanager.FullName "--sdk_root=$sdkRoot" "--install" '"platform-tools"' '"platforms;android-35"' '"build-tools;35.0.0"'

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK package installation failed with exit code $LASTEXITCODE."
          }

      - name: Extract Jarvis source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE

          $archives = @(
            Get-ChildItem -Path $workspace -Filter "*.zip" -File
          )

          if ($archives.Count -ne 1) {
            throw "Expected exactly one source ZIP in repository root. Found: $($archives.Count)"
          }

          $destination = Join-Path $env:RUNNER_TEMP "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $destination -Force

          $packageFiles = @(
            Get-ChildItem -Path $destination -Filter "package.json" -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          )

          $project = $null

          foreach ($file in $packageFiles) {
            try {
              $package = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              if ($null -ne $package.scripts -and $null -ne $package.scripts.'build:android') {
                $project = $file.DirectoryName
                break
              }
            } catch {
              continue
            }
          }

          if (!$project) {
            throw "Android project with build:android script was not found."
          }

          $buildScript = Join-Path $project "scripts\build-android.ps1"
          if (!(Test-Path -LiteralPath $buildScript)) {
            throw "Android build script is missing at: $buildScript"
          }

          "JARVIS_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Jarvis project found: $project"

      - name: Install project dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:JARVIS_PROJECT
          $ErrorActionPreference = "Continue"

          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "NPM dependency installation failed with exit code $LASTEXITCODE."
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:JARVIS_PROJECT
          $ErrorActionPreference = "Continue"

          npm run build:android

          if ($LASTEXITCODE -ne 0) {
            throw "Vishal Jarvis Android compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedApk = Join-Path $env:JARVIS_PROJECT "artifacts\android\Vishal-Jarvis-1.1.1-private.apk"

          if (Test-Path -LiteralPath $expectedApk) {
            $apk = $expectedApk
          } else {
            $fallbackApk = Get-ChildItem -Path (Join-Path $env:JARVIS_PROJECT "artifacts\android") -Filter "*.apk" -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($fallbackApk) {
              $apk = $fallbackApk.FullName
            } else {
              throw "Expected APK was not generated at: $expectedApk"
            }
          }

          $size = (Get-Item -LiteralPath $apk).Length

          if ($size -le 0) {
            throw "Generated APK is empty."
          }

          "APK_PATH=$apk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "APK successfully generated: $apk"
          Write-Host "APK Size: $size bytes"

          Get-FileHash -LiteralPath $apk -Algorithm SHA256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
