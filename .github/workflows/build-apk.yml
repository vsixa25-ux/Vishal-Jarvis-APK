name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version required by your project"
        required: true
        default: "21"
        type: choice
        options:
          - "21"
          - "17"

      android_api:
        description: "Android compile SDK API level"
        required: true
        default: "35"
        type: string

      build_tools:
        description: "Android SDK Build Tools version"
        required: true
        default: "35.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize output directories
        run: |
          $ErrorActionPreference = "Stop"

          $logs = Join-Path $env:RUNNER_TEMP "jarvis-logs"
          $output = Join-Path $env:RUNNER_TEMP "jarvis-apk"

          New-Item -ItemType Directory -Force `
            -Path $logs, $output | Out-Null

          "JARVIS_LOG_DIR=$logs" >> $env:GITHUB_ENV
          "JARVIS_APK_DIR=$output" >> $env:GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check build environment
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          & java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java is not working."
          }

          & node --version
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js is not working."
          }

          & npm.cmd --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm is not working."
          }

          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "Runner: $env:RUNNER_OS"

      - name: Configure Android SDK
        env:
          ANDROID_API: ${{ inputs.android_api }}
          BUILD_TOOLS: ${{ inputs.build_tools }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ($env:ANDROID_API -notmatch '^d+$') {
            throw "Android API must be a number, for example 35."
          }

          if ($env:BUILD_TOOLS -notmatch '^d+.d+.d+$') {
            throw "Build Tools must look like 35.0.0."
          }

          $candidates = @(
            $env:ANDROID_HOME
            $env:ANDROID_SDK_ROOT
            "C:Androidandroid-sdk"
          )

          $sdkRoot = $candidates |
            Where-Object {
              $_ -and (Test-Path -LiteralPath $_ -PathType Container)
            } |
            Select-Object -First 1

          if (!$sdkRoot) {
            throw "Android SDK installation was not found."
          }

          $sdkRoot = (Resolve-Path -LiteralPath $sdkRoot).Path
          $sdkmanager = Join-Path $sdkRoot `
            "cmdline-toolslatest\binsdkmanager.bat"

          if (!(Test-Path -LiteralPath $sdkmanager)) {
            $toolsRoot = Join-Path $sdkRoot "cmdline-tools"

            if (!(Test-Path -LiteralPath $toolsRoot)) {
              throw "Android command-line tools were not found."
            }

            $manager = Get-ChildItem -LiteralPath $toolsRoot `
              -Filter "sdkmanager.bat" -File -Recurse |
              Sort-Object FullName |
              Select-Object -First 1

            if (!$manager) {
              throw "sdkmanager.bat was not found."
            }

            $sdkmanager = $manager.FullName
          }

          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot

          "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

          (Join-Path $sdkRoot "platform-tools") >> $env:GITHUB_PATH
          (Join-Path $sdkRoot "build-tools$env:BUILD_TOOLS") `
            >> $env:GITHUB_PATH

          Write-Host "SDK root: $sdkRoot"
          Write-Host "SDK manager: $sdkmanager"

          $answers = 1..150 | ForEach-Object { "y" }

          $answers |
            & $sdkmanager "--sdk_root=$sdkRoot" --licenses 2>&1 |
            Tee-Object -FilePath `
              "$env:JARVIS_LOG_DIRsdk-licenses.log"

          $licenseExit = $LASTEXITCODE

          if ($licenseExit -ne 0) {
            throw "SDK license acceptance failed: exit $licenseExit."
          }

          & $sdkmanager "--sdk_root=$sdkRoot" --install `
            "platform-tools" `
            "platforms;android-$env:ANDROID_API" `
            "build-tools;$env:BUILD_TOOLS" 2>&1 |
            Tee-Object -FilePath `
              "$env:JARVIS_LOG_DIRsdk-install.log"

          $sdkExit = $LASTEXITCODE

          if ($sdkExit -ne 0) {
            throw "SDK package installation failed: exit $sdkExit."
          }

          $androidJar = Join-Path $sdkRoot `
            "platformsandroid-$env:ANDROID_APIandroid.jar"

          $apksigner = Join-Path $sdkRoot `
            "build-tools$env:BUILD_TOOLSapksigner.bat"

          if (!(Test-Path -LiteralPath $androidJar)) {
            throw "Required Android platform was not installed."
          }

          if (!(Test-Path -LiteralPath $apksigner)) {
            throw "Required Android Build Tools were not installed."
          }

          "JARVIS_APKSIGNER=$apksigner" >> $env:GITHUB_ENV

      - name: Extract and locate Jarvis project
        run: |
          $ErrorActionPreference = "Stop"

          $archives = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE `
              -Filter "*.zip" -File
          )

          if ($archives.Count -ne 1) {
            throw (
              "Keep exactly ONE source ZIP in the repository root. " +
              "Found: $($archives.Count)"
            )
          }

          $destination = Join-Path $env:RUNNER_TEMP "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          Expand-Archive -LiteralPath $archives[0].FullName `
            -DestinationPath $destination -Force

          $packageFiles = @(
            Get-ChildItem -LiteralPath $destination `
              -Filter "package.json" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch `
                '[\\/](node_modules|.git|__MACOSX)[\\/]'
            }
          )

          $projects = @(
            foreach ($file in $packageFiles) {
              try {
                $package = Get-Content -LiteralPath $file.FullName `
                  -Raw | ConvertFrom-Json
              }
              catch {
                throw "Invalid package.json: $($file.FullName)"
              }

              if ($package.scripts.'build:android') {
                $file.DirectoryName
              }
            }
          )

          if ($projects.Count -eq 0) {
            throw "No package.json contains a build:android script."
          }

          if ($projects.Count -gt 1) {
            $list = $projects -join "`n"
            throw "Multiple Android projects found. Keep only one:`n$list"
          }

          $project = $projects[0]
          $buildScript = Join-Path $project "scripts\build-android.ps1"

          if (!(Test-Path -LiteralPath $buildScript -PathType Leaf)) {
            throw "Required script is missing: $buildScript"
          }

          "JARVIS_PROJECT=$project" >> $env:GITHUB_ENV

          Write-Host "Selected source: $($archives[0].Name)"
          Write-Host "Selected project: $project"

          $package = Get-Content `
            -LiteralPath (Join-Path $project "package.json") `
            -Raw | ConvertFrom-Json

          Write-Host "build:android: $($package.scripts.'build:android')"

      - name: Remove previously generated APKs
        run: |
          $ErrorActionPreference = "Stop"

          $oldApks = @(
            Get-ChildItem -LiteralPath $env:JARVIS_PROJECT `
              -Filter "*.apk" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|.git)[\\/]' -and
              $_.FullName -match `
                '[\\/](artifacts[\\/]android|build[\\/]outputs[\\/]apk)[\\/]'
            }
          )

          foreach ($apk in $oldApks) {
            Write-Host "Removing old output: $($apk.FullName)"
            Remove-Item -LiteralPath $apk.FullName -Force
          }

      - name: Install project dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          $hasLock = (
            (Test-Path -LiteralPath "package-lock.json") -or
            (Test-Path -LiteralPath "npm-shrinkwrap.json")
          )

          if ($hasLock) {
            & npm.cmd ci --include=dev --no-audit --no-fund 2>&1 |
              Tee-Object -FilePath `
                "$env:JARVIS_LOG_DIR
pm-install.log"
          }
          else {
            & npm.cmd install --include=dev --no-audit --no-fund 2>&1 |
              Tee-Object -FilePath `
                "$env:JARVIS_LOG_DIR
pm-install.log"
          }

          $npmExit = $LASTEXITCODE

          if ($npmExit -ne 0) {
            throw (
              "Dependency installation failed: exit $npmExit. " +
              "Check npm-install.log."
            )
          }

      - name: Build Android APK
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          & npm.cmd run build:android 2>&1 |
            Tee-Object -FilePath `
              "$env:JARVIS_LOG_DIRandroid-build.log"

          $buildExit = $LASTEXITCODE

          if ($buildExit -ne 0) {
            throw (
              "Android build failed: exit $buildExit. " +
              "Check android-build.log."
            )
          }

      - name: Verify and collect APKs
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $allApks = @(
            Get-ChildItem -LiteralPath $env:JARVIS_PROJECT `
              -Filter "*.apk" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|.git)[\\/]'
            }
          )

          $allApks |
            Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize |
            Out-String -Width 4096 |
            Set-Content -LiteralPath `
              "$env:JARVIS_LOG_DIRapk-files.log"

          $customApks = @(
            $allApks | Where-Object {
              $_.FullName -match '[\\/]artifacts[\\/]android[\\/]'
            }
          )

          if ($customApks.Count -gt 0) {
            $apks = $customApks
          }
          else {
            $apks = @(
              $allApks | Where-Object {
                $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]'
              }
            )
          }

          $apks = @(
            $apks |
            Where-Object { $_.Name -notmatch '(?i)unsigned' } |
            Sort-Object FullName
          )

          if ($apks.Count -eq 0) {
            throw (
              "No signed APK candidate was found in artifacts/android " +
              "or build/outputs/apk. Check android-build.log and apk-files.log."
            )
          }

          $index = 0

          foreach ($apk in $apks) {
            $index++

            if ($apk.Length -le 0) {
              throw "Generated APK is empty: $($apk.FullName)"
            }

            & $env:JARVIS_APKSIGNER verify `
              --verbose --print-certs $apk.FullName 2>&1 |
              Tee-Object -FilePath `
                "$env:JARVIS_LOG_DIRapk-verify-$index.log"

            $verifyExit = $LASTEXITCODE

            if ($verifyExit -ne 0) {
              throw "APK signature verification failed: $($apk.Name)"
            }

            $outputName = "{0:D2}-{1}" -f $index, $apk.Name
            $target = Join-Path $env:JARVIS_APK_DIR $outputName

            Copy-Item -LiteralPath $apk.FullName `
              -Destination $target -Force

            $hash = Get-FileHash -LiteralPath $target -Algorithm SHA256

            "$($hash.Hash)  $outputName" |
              Add-Content -LiteralPath `
                "$env:JARVIS_APK_DIRSHA256SUMS.txt"

            Write-Host "Verified: $outputName"
            Write-Host "Size: $($apk.Length) bytes"
            Write-Host "SHA256: $($hash.Hash)"
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ runner.temp }}/jarvis-apk/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Build-Logs
          path: ${{ runner.temp }}/jarvis-logs/
          if-no-files-found: warn
          retention-days: 7
