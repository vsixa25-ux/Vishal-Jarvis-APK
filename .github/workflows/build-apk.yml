name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $sdkRoot = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or !(Test-Path -LiteralPath $sdkRoot)) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or !(Test-Path -LiteralPath $sdkRoot)) {
            $sdkRoot = "C:\Android\android-sdk"
          }

          if (!(Test-Path -LiteralPath $sdkRoot)) {
            Write-Host "::error::Android SDK installation not found at $sdkRoot"
            exit 1
          }

          $sdkmanager = Get-ChildItem -Path "$sdkRoot" -Filter "sdkmanager.bat" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$sdkmanager) {
            Write-Host "::error::Android SDK Manager (sdkmanager.bat) not found in $sdkRoot"
            exit 1
          }

          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdkmanager.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$sdkRoot\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $cmdFile = Join-Path $env:RUNNER_TEMP "install-android-sdk.cmd"
          @"
          @echo off
          (for /l %%i in (1,1,100) do @echo y) | "$($sdkmanager.FullName)" --sdk_root="$sdkRoot" --licenses >nul 2>&1
          "$($sdkmanager.FullName)" --sdk_root="$sdkRoot" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          exit /b %ERRORLEVEL%
          "@ | Set-Content -LiteralPath $cmdFile -Encoding ascii

          & cmd.exe /c "`"$cmdFile`""
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Android SDK package installation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Extract Jarvis source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE
          $destination = Join-Path $env:RUNNER_TEMP "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $archives = @(
            Get-ChildItem -Path $workspace -Filter "*.zip" -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' -and $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          )

          if ($archives.Count -ge 1) {
            $selectedZip = $archives | Sort-Object Length -Descending | Select-Object -First 1
            Write-Host "Extracting ZIP: $($selectedZip.FullName)"
            Expand-Archive -LiteralPath $selectedZip.FullName -DestinationPath $destination -Force
          } else {
            Write-Host "No ZIP found. Copying repository files directly..."
            Get-ChildItem -Path $workspace -Force |
              Where-Object { $_.Name -ne ".git" -and $_.Name -ne ".github" } |
              Copy-Item -Destination $destination -Recurse -Force
          }

          $packageFiles = @(
            Get-ChildItem -Path $destination -Filter "package.json" -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          )

          $project = $null

          foreach ($file in $packageFiles) {
            try {
              $package = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              if ($null -ne $package.scripts -and $null -ne $package.scripts.'build:android') {
                $project = $file.DirectoryName
                break
              }
            } catch {
              continue
            }
          }

          if (!$project -and $packageFiles.Count -ge 1) {
            $project = $packageFiles[0].DirectoryName
          }

          if (!$project) {
            Write-Host "::error::No package.json found inside your repository or ZIP file."
            exit 1
          }

          $buildScript = Join-Path $project "scripts\build-android.ps1"
          if (Test-Path -LiteralPath $buildScript) {
            $scriptContent = Get-Content -LiteralPath $buildScript -Raw
            $scriptContent = $scriptContent -replace '\$ErrorActionPreference\s*=\s*["'']Stop["'']', '$ErrorActionPreference = "Continue"'
            Set-Content -LiteralPath $buildScript -Value $scriptContent -Encoding utf8
          }

          "JARVIS_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Jarvis project found: $project"

      - name: Install project dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:JARVIS_PROJECT
          $ErrorActionPreference = "Continue"

          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::NPM dependency installation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:JARVIS_PROJECT
          $ErrorActionPreference = "Continue"

          npm run build:android

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Vishal Jarvis Android compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedApk = Join-Path $env:JARVIS_PROJECT "artifacts\android\Vishal-Jarvis-1.1.1-private.apk"

          if (Test-Path -LiteralPath $expectedApk) {
            $apk = $expectedApk
          } else {
            $fallbackApk = Get-ChildItem -Path $env:JARVIS_PROJECT -Filter "*.apk" -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($fallbackApk) {
              $apk = $fallbackApk.FullName
            } else {
              Write-Host "::error::Expected APK was not generated anywhere in $env:JARVIS_PROJECT"
              exit 1
            }
          }

          $size = (Get-Item -LiteralPath $apk).Length

          if ($size -le 0) {
            Write-Host "::error::Generated APK is empty (0 bytes)."
            exit 1
          }

          "APK_PATH=$apk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "APK successfully generated: $apk"
          Write-Host "APK Size: $size bytes"

          Get-FileHash -LiteralPath $apk -Algorithm SHA256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
