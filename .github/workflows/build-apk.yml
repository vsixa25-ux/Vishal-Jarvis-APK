
name: Vishal Jarvis Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Install Android SDK and accept licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-35
            build-tools;35.0.0

      # 5. Verify build environment
      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (!(Test-Path $env:ANDROID_HOME)) {
            throw "ANDROID_HOME is not available."
          }

          if (!(Test-Path $env:JAVA_HOME)) {
            throw "JAVA_HOME is not available."
          }

          $required = @(
            "$env:ANDROID_HOME\platforms\android-35\android.jar",
            "$env:ANDROID_HOME\build-tools\35.0.0\aapt2.exe",
            "$env:ANDROID_HOME\build-tools\35.0.0\d8.bat",
            "$env:ANDROID_HOME\build-tools\35.0.0\zipalign.exe",
            "$env:ANDROID_HOME\build-tools\35.0.0\apksigner.bat",
            "$env:JAVA_HOME\bin\javac.exe",
            "$env:JAVA_HOME\bin\keytool.exe"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required build tool: $file"
            }
          }

          java -version
          node --version
          npm --version

          Write-Host "Build environment verified."

      # 6. Locate and extract the source ZIP
      - name: Extract Jarvis source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archives = @(
            Get-ChildItem $env:GITHUB_WORKSPACE `
              -Filter '*.zip' -File
          )

          if ($archives.Count -ne 1) {
            throw "Expected one source ZIP in repository root. Found: $($archives.Count)"
          }

          $destination = Join-Path `
            $env:RUNNER_TEMP 'jarvis-source'

          New-Item -ItemType Directory `
            -Path $destination -Force | Out-Null

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath $destination -Force

          $packageFiles = @(
            Get-ChildItem $destination `
              -Filter 'package.json' -File -Recurse
          )

          $project = $null

          foreach ($file in $packageFiles) {
            $config = Get-Content $file.FullName -Raw |
              ConvertFrom-Json

            if ($config.scripts.'build:android') {
              $project = $file.DirectoryName
              break
            }
          }

          if (!$project) {
            throw "Valid Vishal Jarvis Android project not found."
          }

          $script = Join-Path $project `
            'scripts\build-android.ps1'

          if (!(Test-Path $script)) {
            throw "Android build script is missing."
          }

          "JARVIS_PROJECT=$project" >> $env:GITHUB_ENV

          Write-Host "Project located: $project"

      # 7. Install dependencies
      - name: Install Node dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:JARVIS_PROJECT

          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "NPM installation failed."
          }

      # 8. Build APK using the original project script
      - name: Compile Vishal Jarvis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:JARVIS_PROJECT

          pwsh -NoProfile -File `
            scripts/build-android.ps1 `
            -SdkRoot $env:ANDROID_HOME `
            -JavaRoot $env:JAVA_HOME

          if ($LASTEXITCODE -ne 0) {
            throw "Vishal Jarvis compilation failed."
          }

      # 9. Verify and copy APK
      - name: Verify APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:JARVIS_PROJECT `
            'artifacts\android\Vishal-Jarvis-1.1.1-private.apk'

          if (!(Test-Path $source)) {
            throw "Expected APK was not generated."
          }

          $apkInfo = Get-Item $source

          if ($apkInfo.Length -lt 10000) {
            throw "APK file is unexpectedly small."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE `
            'Vishal-Jarvis-Android.apk'

          Copy-Item $source $output -Force

          Write-Host "APK size: $($apkInfo.Length) bytes"

          Get-FileHash $output -Algorithm SHA256

          "APK_PATH=$output" >> $env:GITHUB_ENV

      # 10. Upload downloadable APK
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: Vishal-Jarvis-Android.apk
          if-no-files-found: error
          retention-days: 7
