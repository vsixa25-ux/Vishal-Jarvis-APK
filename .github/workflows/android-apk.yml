name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK package installation failed."
          }

      - name: Extract Jarvis source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE

          $archives = @(
            Get-ChildItem `
              -LiteralPath $workspace `
              -Filter "*.zip" `
              -File
          )

          if ($archives.Count -ne 1) {
            throw (
              "Expected exactly one source ZIP in repository root. " +
              "Found: $($archives.Count)"
            )
          }

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item `
              -LiteralPath $destination `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath $destination `
            -Force

          $packageFiles = @(
            Get-ChildItem `
              -LiteralPath $destination `
              -Filter "package.json" `
              -File `
              -Recurse
          )

          $projects = @()

          foreach ($file in $packageFiles) {
            try {
              $package = Get-Content `
                -LiteralPath $file.FullName `
                -Raw |
                ConvertFrom-Json
            }
            catch {
              continue
            }

            if ($package.scripts.'build:android') {
              $projects += $file.DirectoryName
            }
          }

          if ($projects.Count -ne 1) {
            throw (
              "Expected exactly one Android project with " +
              "build:android script. Found: $($projects.Count)"
            )
          }

          $project = $projects[0]

          $buildScript = Join-Path `
            $project `
            "scripts\build-android.ps1"

          if (!(Test-Path -LiteralPath $buildScript)) {
            throw "Android build script is missing: $buildScript"
          }

          "JARVIS_PROJECT=$project" >> $env:GITHUB_ENV

          Write-Host "Jarvis project found: $project"

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          if (
            (Test-Path -LiteralPath "package-lock.json") -or
            (Test-Path -LiteralPath "npm-shrinkwrap.json")
          ) {
            npm ci --include=dev --no-audit --no-fund
          }
          else {
            npm install --include=dev --no-audit --no-fund
          }

          if ($LASTEXITCODE -ne 0) {
            throw "NPM dependency installation failed."
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          npm run build:android

          if ($LASTEXITCODE -ne 0) {
            throw "Vishal Jarvis Android compilation failed."
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $apk = Join-Path `
            $env:JARVIS_PROJECT `
            "artifactsandroidVishal-Jarvis-1.1.1-private.apk"

          if (!(Test-Path -LiteralPath $apk)) {
            throw "Expected APK was not generated: $apk"
          }

          $size = (Get-Item -LiteralPath $apk).Length

          if ($size -le 0) {
            throw "Generated APK is empty."
          }

          Write-Host "APK successfully generated."
          Write-Host "APK size: $size bytes"

          Get-FileHash `
            -LiteralPath $apk `
            -Algorithm SHA256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ runner.temp }}/jarvis-source/**/artifacts/android/Vishal-Jarvis-1.1.1-private.apk
          if-no-files-found: error
          retention-days: 7
