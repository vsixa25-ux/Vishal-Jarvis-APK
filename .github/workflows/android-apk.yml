name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK package installation failed."
          }

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archives = @(
            Get-ChildItem `
              -LiteralPath $env:GITHUB_WORKSPACE `
              -Filter "*.zip" `
              -File
          )

          if ($archives.Count -ne 1) {
            throw "Repository root-এ ঠিক একটি ZIP ফাইল থাকতে হবে। পাওয়া গেছে: $($archives.Count)"
          }

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item `
              -LiteralPath $destination `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath $destination `
            -Force

          $projects = @()

          $packageFiles = @(
            Get-ChildItem `
              -LiteralPath $destination `
              -Filter "package.json" `
              -File `
              -Recurse
          )

          foreach ($file in $packageFiles) {
            try {
              $package = Get-Content `
                -LiteralPath $file.FullName `
                -Raw |
                ConvertFrom-Json
            }
            catch {
              continue
            }

            if (
              $package.scripts -and
              $package.scripts.'build:android'
            ) {
              $projects += $file.DirectoryName
            }
          }

          if ($projects.Count -ne 1) {
            throw "build:android script-সহ ঠিক একটি project প্রয়োজন। পাওয়া গেছে: $($projects.Count)"
          }

          $project = $projects[0]

          $buildScript = Join-Path `
            $project `
            "scripts\build-android.ps1"

          if (!(Test-Path -LiteralPath $buildScript -PathType Leaf)) {
            throw "scripts/build-android.ps1 পাওয়া যায়নি।"
          }

          $javaFile = Join-Path `
            $project `
            "androidappsrcmainjavacommyraamobileLiveVoiceService.java"

          if (Test-Path -LiteralPath $javaFile -PathType Leaf) {
            $javaSource = Get-Content `
              -LiteralPath $javaFile `
              -Raw

            $javaSource = $javaSource -replace `
              's*.setSilent(true)', ''

            Set-Content `
              -LiteralPath $javaFile `
              -Value $javaSource `
              -Encoding UTF8
          }

          "JARVIS_PROJECT=$project" >> $env:GITHUB_ENV

          Write-Host "Project found: $project"

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          if (
            (Test-Path -LiteralPath "package-lock.json") -or
            (Test-Path -LiteralPath "npm-shrinkwrap.json")
          ) {
            npm ci --include=dev --no-audit --no-fund
          }
          else {
            npm install --include=dev --no-audit --no-fund
          }

          if ($LASTEXITCODE -ne 0) {
            throw "NPM dependency installation failed."
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          npm run build:android

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed."
          }

      - name: Locate and verify APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedApk = Join-Path `
            $env:JARVIS_PROJECT `
            "artifactsandroidVishal-Jarvis-1.1.1-private.apk"

          if (Test-Path -LiteralPath $expectedApk -PathType Leaf) {
            $apk = Get-Item -LiteralPath $expectedApk
          }
          else {
            $apkCandidates = @(
              Get-ChildItem `
                -LiteralPath $env:JARVIS_PROJECT `
                -Filter "*.apk" `
                -File `
                -Recurse |
              Where-Object {
                $_.FullName -notmatch `
                  '[\\/](node_modules|.git)[\\/]' -and
                $_.FullName -match `
                  '[\\/](artifacts[\\/]android|build[\\/]outputs[\\/]apk)[\\/]'
              } |
              Sort-Object LastWriteTime -Descending
            )

            if ($apkCandidates.Count -eq 0) {
              throw "কোনো APK পাওয়া যায়নি।"
            }

            $apk = $apkCandidates[0]
          }

          if ($apk.Length -le 0) {
            throw "APK ফাইলটি খালি।"
          }

          Write-Host "APK: $($apk.FullName)"
          Write-Host "APK size: $($apk.Length) bytes"

          $hash = Get-FileHash `
            -LiteralPath $apk.FullName `
            -Algorithm SHA256

          Write-Host "SHA256: $($hash.Hash)"

          $apkOutput = Join-Path `
            $env:RUNNER_TEMP `
            "Vishal-Jarvis-Android.apk"

          Copy-Item `
            -LiteralPath $apk.FullName `
            -Destination $apkOutput `
            -Force

          "APK_OUTPUT=$apkOutput" >> $env:GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ runner.temp }}/Vishal-Jarvis-Android.apk
          if-no-files-found: error
          retention-days: 7
