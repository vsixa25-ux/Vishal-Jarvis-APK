
name: Vishal Jarvis - Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK package installation failed."
          }

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archives = @(
            Get-ChildItem `
              -LiteralPath $env:GITHUB_WORKSPACE `
              -Filter "*.zip" `
              -File
          )

          if ($archives.Count -ne 1) {
            throw "Exactly one source ZIP is required."
          }

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "jarvis-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item `
              -LiteralPath $destination `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath $destination `
            -Force

          $projects = @()

          $packageFiles = @(
            Get-ChildItem `
              -LiteralPath $destination `
              -Filter "package.json" `
              -File `
              -Recurse
          )

          foreach ($file in $packageFiles) {
            try {
              $package = Get-Content `
                -LiteralPath $file.FullName `
                -Raw |
                ConvertFrom-Json
            }
            catch {
              continue
            }

            if (
              $package.scripts -and
              $package.scripts.'build:android'
            ) {
              $projects += $file.DirectoryName
            }
          }

          if ($projects.Count -ne 1) {
            throw "Exactly one project with build:android is required."
          }

          $project = $projects[0]

          $buildScript = Join-Path `
            $project `
            "scripts\build-android.ps1"

          if (!(Test-Path -LiteralPath $buildScript -PathType Leaf)) {
            throw "scripts/build-android.ps1 not found."
          }

          # Correct Java source patching
          $javaFiles = @(
            Get-ChildItem `
              -LiteralPath $project `
              -Filter "*.java" `
              -File `
              -Recurse
          )

          foreach ($javaFile in $javaFiles) {

            $source = Get-Content `
              -LiteralPath $javaFile.FullName `
              -Raw

            # Correct regex: matches .setSilent(true)
            $source = $source -replace `
              '\s*\.\s*setSilent\s*\(\s*true\s*\)', ''

            [System.IO.File]::WriteAllText(
              $javaFile.FullName,
              $source,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          "JARVIS_PROJECT=$project" >> $env:GITHUB_ENV

          Write-Host "Project detected: $project"
          Write-Host "Java files processed: $($javaFiles.Count)"

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          if (
            (Test-Path -LiteralPath "package-lock.json") -or
            (Test-Path -LiteralPath "npm-shrinkwrap.json")
          ) {
            npm ci --include=dev --no-audit --no-fund
          }
          else {
            npm install --include=dev --no-audit --no-fund
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Project dependency installation failed."
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:JARVIS_PROJECT

          $buildLog = Join-Path `
            $env:RUNNER_TEMP `
            "android-build.log"

          Write-Host "Starting Android build..."

          & npm run build:android 2>&1 |
            Tee-Object -FilePath $buildLog

          $buildExitCode = $LASTEXITCODE

          if ($buildExitCode -ne 0) {
            Write-Host "Android compilation failed."
            Write-Host "Build log: $buildLog"

            throw "Android Java compilation/build failed. Exit code: $buildExitCode"
          }

          Write-Host "Android build completed successfully."

      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Build-Log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $apkFiles = @(
            Get-ChildItem `
              -LiteralPath $env:JARVIS_PROJECT `
              -Filter "*.apk" `
              -File `
              -Recurse |
            Where-Object {
              $_.FullName -notmatch `
                '[\\/](node_modules|\.git)[\\/]' -and
              $_.FullName -match `
                '[\\/](artifacts[\\/]android|build[\\/]outputs[\\/]apk)[\\/]'
            } |
            Sort-Object LastWriteTime -Descending
          )

          if ($apkFiles.Count -eq 0) {
            throw "No APK file was generated."
          }

          $apk = $apkFiles[0]

          if ($apk.Length -le 0) {
            throw "Generated APK is empty."
          }

          $output = Join-Path `
            $env:RUNNER_TEMP `
            "Vishal-Jarvis-Android.apk"

          Copy-Item `
            -LiteralPath $apk.FullName `
            -Destination $output `
            -Force

          Get-FileHash `
            -LiteralPath $output `
            -Algorithm SHA256

          "APK_OUTPUT=$output" >> $env:GITHUB_ENV

          Write-Host "APK successfully found: $($apk.FullName)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-APK
          path: ${{ runner.temp }}/Vishal-Jarvis-Android.apk
          if-no-files-found: error
          retention-days: 7
